global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'self'
    static_configs:
      - targets: ['localhost:9090']
  
  # Federation: hole Metriken von fog-Cluster Prometheus
  - job_name: 'federate-edge'

    honor_labels: true # 
    metrics_path: '/federate'

    params:
      'match[]':
        - '{__name__=~".+"}'   # Alle Metriken

    static_configs:
      - targets: 
        - '172.18.0.26:31288' # edge-Cluster Prometheus URL

  - job_name: 'federate-fog'
 
    honor_labels: true
    metrics_path: '/federate'

    params:
      'match[]':
        - '{__name__=~".+"}'   # Alle Metriken

    static_configs:
      - targets: 
        - '172.18.0.23:32304' # fog-Cluster Prometheus URL
