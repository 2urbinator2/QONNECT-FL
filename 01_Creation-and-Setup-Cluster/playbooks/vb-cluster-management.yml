- name: Prüfe ob K3s auf den Control-Instanzen vorhanden ist
  hosts: "*-control"
  become: yes
  tasks:
    - name: Erstelle lokales Verzeichnis falls nicht vorhanden
      ansible.builtin.file:
        path: "{{ lookup('env','HOME') }}/.kube/vbox-cluster"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true
      become: no

    - name: Verzeichnis /etc/rancher/k3s prüfen
      ansible.builtin.stat:
        path: /etc/rancher/k3s
      register: k3s_dir
    
    - name: Abbrechen falls Verzeichnis fehlt
      ansible.builtin.fail:
        msg: "❌ K3s scheint nicht installiert zu sein! Verzeichnis /etc/rancher/k3s fehlt."
      when: not k3s_dir.stat.exists
    
    - name: Sicherstellen, dass config.yaml existiert
      ansible.builtin.file:
        path: /etc/rancher/k3s/config.yaml
        state: touch
        mode: '0644'
  
    - name: Ermittele die IP des enp0s10 Interfaces
      ansible.builtin.command: ip -4 addr show enp0s10
      register: enp0s10_ip_raw

    - name: Extrahiere die IP-Adresse
      ansible.builtin.set_fact:
        advertise_ip: "{{ (enp0s10_ip_raw.stdout | regex_search('inet ([0-9.]+)/', '\\1')) | first }}"

    - name: Schreibe config.yaml mit dynamischer advertise-address
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          advertise-address: {{ advertise_ip }}
          tls-san:
            - {{ advertise_ip }}
        owner: root
        group: root
        mode: '0644'
    
    - name: K3s neu starten
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: k3s_dir.stat.exists

    - name: Kopiere k3s.yaml vom Host auf den lokalen Rechner
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ lookup('env','HOME') }}/.kube/vbox-cluster/{{ inventory_hostname }}.yaml"
        flat: yes
  
    - name: Ersetze localhost mit enp0s10-IP in der übertragenen k3s.yaml
      ansible.builtin.replace:
        path: "{{ lookup('env','HOME') }}/.kube/vbox-cluster/{{ inventory_hostname }}.yaml"
        regexp: 'server: https://127\.0\.0\.1:6443'
        replace: "server: https://{{ advertise_ip }}:6443"
      delegate_to: localhost
      become: no

- name: Benenne Default-Kontext passend zum Cluster
  hosts: localhost
  tasks:
    - name: Passe Kontextnamen dynamisch an
      ansible.builtin.shell: |
        for file in ~/.kube/vbox-cluster/*.yaml; do
          # existierenden Kontext auslesen
          current_context=$(kubectl --kubeconfig "$file" config view -o jsonpath='{.contexts[0].name}')
          # gewünschten Cluster-Namen ableiten aus Dateiname
          cluster_name=$(basename "$file" .yaml | sed 's/-Control//; s/-Worker//')
          # umbenennen, nur wenn Name unterschiedlich
          if [ "$current_context" != "$cluster_name" ]; then
            kubectl --kubeconfig "$file" config rename-context "$current_context" "$cluster_name"
          fi
        done
      args:
        executable: /bin/bash

    - name: Zusammenführen der kubeconfig Dateien
      ansible.builtin.shell: >
        KUBECONFIG=$(ls ~/.kube/vbox-cluster/*.yaml | tr '\n' ':') kubectl config view --flatten > ~/.kube/config
      args:
        executable: /bin/bash




