apiVersion: v1
kind: ConfigMap
metadata:
  name: resource-agent
data:
  config.yaml: |
    app:
      type: "cloud"
      heartbeatinterval: 10
      deploymenttimeout: 60

    httpserver:
      host: 0.0.0.0
      port: 8082
      gracefulshutdowntimeout: 5

    registersvc:
      host: 10.0.1.29
      port: 80
      timeout: 5