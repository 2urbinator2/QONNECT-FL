---
- name: Knowledge Base Setup on Debian
  hosts: all
  become: yes
  vars:
    postgres_user: foo
    postgres_password: pass
    postgres_db: knowledge_base
    migration_path: /migrations
    ansible_remote_tmp: /tmp/.ansible-${USER}

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Ensure psycopg2 is installed via apt
      apt:
        name: python3-psycopg2
        state: present
        update_cache: yes

    - name: Install PostgreSQL
      apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present
        update_cache: yes

    - name: Ensure PostgreSQL is running
      service:
        name: postgresql
        state: started
        enabled: yes

    - name: Create PostgreSQL user
      become: yes
      shell: |
        sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='{{ postgres_user }}'" | grep -q 1 || \
        sudo -u postgres psql -c "CREATE USER {{ postgres_user }} WITH PASSWORD '{{ postgres_password }}' CREATEDB;"
      args:
        executable: /bin/bash

    - name: Create PostgreSQL database
      become: yes
      shell: |
        sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname='{{ postgres_db }}'" | grep -q 1 || \
        sudo -u postgres psql -c "CREATE DATABASE {{ postgres_db }} OWNER {{ postgres_user }};"
      args:
        executable: /bin/bash

    - name: Wait for PostgreSQL to be ready
      wait_for:
        host: 127.0.0.1
        port: 5432
        delay: 3
        timeout: 30

    - name: Ensure migrations directory exists on target
      file:
        path: /opt/knowledge-base/migrations
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy migration files to target server
      copy:
        src: migrations/
        dest: /opt/knowledge-base/migrations/
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

# Bis heirhin klappt es 
    - name: Download migrate CLI
      become: yes
      get_url:
        url: https://github.com/golang-migrate/migrate/releases/download/v4.16.0/migrate.linux-amd64.tar.gz
        dest: /tmp/migrate.tar.gz

    - name: Extract migrate CLI to temp folder
      become: yes
      unarchive:
        src: /tmp/migrate.tar.gz
        dest: /tmp/migrate
        remote_src: yes
        extra_opts: [--strip-components=1]

    - name: Move migrate binary to /usr/local/bin
      become: yes
      command: mv /tmp/migrate/migrate /usr/local/bin/migrate

    - name: Ensure migrate is executable
      become: yes
      file:
        path: /usr/local/bin/migrate
        mode: '0755'

    - name: Run database migrations
      become: yes
      shell: |
        cd /opt/knowledge-base
        /usr/local/bin/migrate -database "postgres://{{ postgres_user }}:{{ postgres_password }}@localhost:5432/{{ postgres_db }}?sslmode=disable" -path ./migrations up
      args:
        executable: /bin/bash
