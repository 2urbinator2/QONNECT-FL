- name: create-database
  hosts: knowledge_base
  become: yes
  tasks:

    - name: Install dependencies 
      apt:
        name:
          - python3
          - python3-pip
          - libpq-dev
          - acl
        state: present
        update_cache: yes
    
    - name: Install psycopg2 for Python3
      pip:
        name: psycopg2-binary
        executable: pip3

    - name: Install PostgreSQL
      apt:
        name: postgresql
        state: present

    - name: Start PostgreSQL
      service:
        name: postgresql
        state: started
        enabled: yes

    - name: Create remote_tmp for  PostgreSQL
      file:
        path: /var/lib/postgresql/.ansible/tmp
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Create PostgreSQL user
      postgresql_user:
        name: foo
        password: pass
        state: present
        login_user: postgres
    
