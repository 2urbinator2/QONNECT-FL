- name: create-database
  hosts: all
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:

    - name: Install dependencies 
      apt:
        name:
          - python3
          - python3-pip
          - libpq-dev
          - acl
        state: present
        update_cache: yes
    
    - name: Install psycopg2 for Python3
      pip:
        name: psycopg2-binary
        executable: pip3

    - name: Installiere PostgreSQL
      apt:
        name: postgresql
        state: present

    - name: Start PostgreSQL
      service:
        name: postgresql
        state: started
        enabled: yes

    - name: Create remote_tmp for  PostgreSQL
      file:
        path: /var/lib/postgresql/.ansible/tmp
        state: directory
        owner: postgres
        group: postgres
        mode: '0700'

    - name: Create PostgreSQL user
      become_user: postgres
      postgresql_user:
          name: foo
          password: pass
          state: present
    
    - name: Create PostgreSQL database
      become_user: postgres
      postgresql_db:
        name: knowledge_base
        owner: foo
        state: present

    - name: PostgreSQL listen auf allen Interfaces
      lineinfile:
        path: /etc/postgresql/14/main/postgresql.conf
        regexp: '^#?listen_addresses'
        line: "listen_addresses = '*'"
        state: present

    - name: Zugriffsregeln für alle IPs in pg_hba.conf eintragen
      lineinfile:
        path: /etc/postgresql/14/main/pg_hba.conf
        regexp: '^host'
        line: "host    all     all     0.0.0.0/0     md5"
        state: present

    - name: PostgreSQL neu starten, damit Änderungen wirksam werden
      service:
        name: postgresql
        state: restarted