[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "FL on Qonnect infrastructure"
version = "1.0.0"
description = "FL with Flower for TS"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.27.0",
    "flwr-datasets[vision]>=0.6.0",
    "fastai==2.8.4",
    "torch==2.8.0",
    "torchvision==0.23.0",   
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "Felix Urban"

[tool.flwr.app.components]
serverapp = "federated.server_app:app"
clientapp = "federated.client_app:app"

[tool.flwr.app.config]
run=1
num-partitions = 3
num-server-rounds = 5
learning-rate = 0.001
arch = "TSTPlus"
epochs = 1
data_path = "./../data/train.csv"
safe_path="../models/decentral-sim"